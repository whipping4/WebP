<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>윤년 판별기</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f0f4ff, #dfeaff);
      font-family: Arial, sans-serif;
    }
    .container {
      background: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
      color: #2d3a8c;
    }
    input {
      padding: 10px 12px;
      font-size: 16px;
      margin-right: 10px;
      border: 1px solid #c7d2fe;
      border-radius: 8px;
    }
    button {
      padding: 10px 16px;
      font-size: 16px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #4338ca;
    }
    p {
      margin-top: 20px;
      font-size: 18px;
      color: #1f2937;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>윤년 판별기</h1>
    <label for="yearInput">년도를 입력하세요:</label>
    <input type="number" id="yearInput" placeholder="예: 2024">
    <button onclick="checkLeapYear()">판별하기</button>
    <p id="result">결과가 여기에 표시됩니다.</p>
  </div>

  <script>
    function isLeapYear(year) {
      if (year % 400 === 0) return true;
      if (year % 100 === 0) return false;
      return year % 4 === 0;
    }

    function checkLeapYear() {
      const yearInput = document.getElementById("yearInput");
      const result = document.getElementById("result");
      const year = Number(yearInput.value);

      if (yearInput.value === "" || Number.isNaN(year)) {
        result.textContent = "년도를 올바르게 입력해주세요.";
        return;
      }

      if (isLeapYear(year)) {
        result.textContent = `${year}년은 윤년입니다.`;
      } else {
        result.textContent = `${year}년은 윤년이 아닙니다.`;
      }
    }
  </script>
</body>
</html>
